version: '3.7'

services:
  app:
    tty: true
    build:
      context: ../
      network: ${NETWORK_NAME:-agicms-default}
      args:
        - ENV_MODE=development
        - JWT_SECRET=${JWT_SECRET}
        - DATABASE_URL=${DATABASE_URL}
        - SUDO_PASSWORD=${SUDO_PASSWORD}
        - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
        - NEXT_PUBLIC_TELEGRAM_BOT_NAME=${NEXT_PUBLIC_TELEGRAM_BOT_NAME}
        - NEXT_PUBLIC_POSTS_ENABLED=${NEXT_PUBLIC_POSTS_ENABLED}
        - NEXT_PUBLIC_CRYPTO_ENABLED=${NEXT_PUBLIC_CRYPTO_ENABLED}
        - NEXT_PUBLIC_WORLD3D_ENABLED=${NEXT_PUBLIC_WORLD3D_ENABLED}
        - NEXT_PUBLIC_DEBUG_WORLD3D=${NEXT_PUBLIC_DEBUG_WORLD3D}
        - NEXT_PUBLIC_SITE_TITLE=${NEXT_PUBLIC_SITE_TITLE}
        - NEXT_PUBLIC_MAIN_PAGE_TITLE=${NEXT_PUBLIC_MAIN_PAGE_TITLE}
        - NEXT_PUBLIC_SITE_SIGNUP_STRATEGY=${NEXT_PUBLIC_SITE_SIGNUP_STRATEGY}
        - NEXT_PUBLIC_BETTERLYTICS_SITE_ID=${NEXT_PUBLIC_BETTERLYTICS_SITE_ID}
        - NEXT_PUBLIC_BETTERLYTICS_SCRIPT_URL=${NEXT_PUBLIC_BETTERLYTICS_SCRIPT_URL}
        - NEXT_PUBLIC_BETTERLYTICS_SERVER_URL=${NEXT_PUBLIC_BETTERLYTICS_SERVER_URL}
        - NEXT_USE_TURBOPACK=${NEXT_USE_TURBOPACK}
        - NEXT_PUBLIC_CRYPTO_CHAIN_ID=${NEXT_PUBLIC_CRYPTO_CHAIN_ID}
        - NEXT_PUBLIC_CRYPTO_CHAIN_ID_HEX=${NEXT_PUBLIC_CRYPTO_CHAIN_ID_HEX}
        - NEXT_PUBLIC_ALLOW_GENERATE_IMAGES=${NEXT_PUBLIC_ALLOW_GENERATE_IMAGES}
    volumes:
      - ../public:/app/public
      - ../shared:/app/shared
      - ../uploads:/app/uploads
      - ../storage:/app/storage
      - ./mailserver/config:/app/mailserver-config
    environment:
      - ENV_MODE=development
      - NEXT_PUBLIC_SITE_SIGNUP_STRATEGY=${NEXT_PUBLIC_SITE_SIGNUP_STRATEGY:-}
      - USER_DEFAULT_STATUS=${USER_DEFAULT_STATUS:-}
    env_file:
      - .env

  supabase:
    image: supabase/postgres:15.1.0.147
    volumes:
      - ./supabase/data:/var/lib/postgresql/data
      # - ./supabase/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    environment:
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD:-your_supabase_password}
      - POSTGRES_DB=${SUPABASE_DB_NAME:-postgres}
    env_file:
      - .env
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.3.6
    command:
      - '--providers.docker.network=${NETWORK_NAME:-agicms-default}'
    volumes:
      - ${TRAEFIK_STATIC_CONFIG:-./traefik/traefik.yml}:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_DYNAMIC_DIR:-./traefik/dynamic/local}:/etc/traefik/dynamic:ro
      - ./traefik/logs:/var/log/traefik
      - ./traefik/certs:/etc/traefik/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - 'traefik.enable=true'
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${MAIL_HOSTNAME:-mail.localhost}
    domainname: ${MAIL_DOMAIN:-localhost}
    volumes:
      - ./mailserver/mail-data:/var/mail
      - ./mailserver/mail-state:/var/mail-state
      - ./mailserver/mail-logs:/var/log/mail
      - ./mailserver/config:/tmp/docker-mailserver
    environment:
      - ENABLE_SPAMASSASSIN=${MAIL_ENABLE_SPAMASSASSIN:-0}
      - ENABLE_CLAMAV=${MAIL_ENABLE_CLAMAV:-0}
      - ENABLE_FAIL2BAN=${MAIL_ENABLE_FAIL2BAN:-0}
      - ENABLE_POSTGREY=${MAIL_ENABLE_POSTGREY:-0}
      - ONE_DIR=1
      - ENABLE_POP3=${MAIL_ENABLE_POP3:-0}
      - ENABLE_IMAP=${MAIL_ENABLE_IMAP:-1}
      - SMTP_ONLY=${MAIL_SMTP_ONLY:-0}
      - SSL_TYPE=${MAIL_SSL_TYPE:-}
      - PERMIT_DOCKER=${MAIL_PERMIT_DOCKER:-connected-networks}
      - POSTFIX_INET_PROTOCOLS=ipv4
      - DEFAULT_RELAY_HOST=${MAIL_RELAY_HOST:-}
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

  mailhog:
    image: mailhog/mailhog

  coturn:
    image: coturn/coturn:latest
    command:
      - '--use-auth-secret'
      - '--static-auth-secret=${TURN_SECRET}'
      - '--realm=${TURN_REALM:-localhost}'
      - '--listening-port=3478'
      - '--tls-listening-port=5349'
      - '--min-port=49152'
      - '--max-port=49200'
      - '--log-file=stdout'
      - '--no-cli'
      - '--fingerprint'
    ports:
      - 3478:3478
      - 3478:3478/udp
      - 5349:5349
      - 5349:5349/udp
      - 49152-49200:49152-49200/udp

  world3d:
    build:
      context: ./world3d
    volumes:
      - ../storage:/app/storage
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM:-localhost}
      - TURN_HOST=${TURN_HOST:-coturn}
    expose:
      - '4101'

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    volumes:
      - ./llama/models:/models
      - ./llama/config:/config
      - ./llama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/entrypoint.sh']
    environment:
      # Model path in format: owner/repo/filename (auto-downloads from HuggingFace)
      - LLAMA_MODEL=${LLAMA_MODEL:-unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q8_0.gguf}
      # HuggingFace token for gated models (optional)
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      # Number of layers to offload to GPU (99 = all)
      - LLAMA_GPU_LAYERS=${LLAMA_GPU_LAYERS:-99}
      # Context window size in tokens
      - LLAMA_CTX_SIZE=${LLAMA_CTX_SIZE:-4096}
      # Server port
      - LLAMA_PORT=${LLAMA_PORT:-8080}
      # Enable verbose logging (0/1)
      - LLAMA_VERBOSE=${LLAMA_VERBOSE:-0}
      # Enable Jinja template engine (0/1)
      - LLAMA_JINJA=${LLAMA_JINJA:-1}
      # Built-in template name: chatml, llama2, llama3, qwen, gemma, phi3, deepseek, etc.
      - LLAMA_CHAT_TEMPLATE=${LLAMA_CHAT_TEMPLATE:-}
      # Path to custom Jinja template file (inside /config volume)
      - LLAMA_CHAT_TEMPLATE_FILE=${LLAMA_CHAT_TEMPLATE_FILE:-}
      # JSON kwargs for template, e.g. '{"enable_thinking":false}'
      # Note: only set if non-empty, llama-server reads this directly
      - LLAMA_TEMPLATE_KWARGS=${LLAMA_TEMPLATE_KWARGS:-}
      # Multimodal projection for vision models (format: owner/repo/filename)
      - LLAMA_MMPROJ=${LLAMA_MMPROJ:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  default:
    name: ${NETWORK_NAME:-agicms-default}
