query file($where: FileWhereUniqueInput!) {
  file(where: $where) {
    ...FileDetailed
  }
}

query files(
  $take: Int
  $skip: Int
  $where: FileWhereInput
  $orderBy: FileOrderByInput
) {
  files(take: $take, skip: $skip, where: $where, orderBy: $orderBy) {
    ...File_
  }
}

query filesConnection(
  $take: Int
  $skip: Int
  $where: FileWhereInput
  $orderBy: FileOrderByInput
) {
  filesCount(where: $where)
  files(take: $take, skip: $skip, where: $where, orderBy: $orderBy) {
    ...FileDetailed
  }
}

mutation singleUpload($data: SingleUploadInput!) {
  singleUpload(data: $data) {
    ...FileDetailed
  }
}

mutation updateFile($data: FileUpdateInput!, $where: FileWhereUniqueInput!) {
  response: updateFile(data: $data, where: $where) {
    ...FileDetailed
  }
}

fragment FileNoNesting on File {
  id
  createdAt
  path
  filename
  name
  description
  mimetype
  createdById
}

fragment File_ on File {
  ...FileNoNesting
}

fragment FileDetailed on File {
  ...File_
  content
  CreatedBy {
    ...UserNoNesting
  }
}
